basePath: /api
definitions:
  attemptanswers.SaveAnswerRequest:
    properties:
      answer_data:
        type: object
      answer_text:
        type: string
      attempt_id:
        type: string
      question_id:
        type: string
    required:
    - attempt_id
    - question_id
    type: object
  attempts.StartAttemptRequest:
    properties:
      test_id:
        type: string
    required:
    - test_id
    type: object
  auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  auth.RefreshTokenRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.RegisterRequest:
    properties:
      email:
        maxLength: 255
        type: string
      full_name:
        maxLength: 255
        minLength: 3
        type: string
      password:
        maxLength: 100
        minLength: 8
        type: string
    required:
    - email
    - full_name
    - password
    type: object
  questions.CreateQuestionRequest:
    properties:
      correct_answer:
        type: string
      display_order:
        minimum: 1
        type: integer
      explanation:
        type: string
      points:
        minimum: 1
        type: integer
      question_data:
        type: object
      question_text:
        type: string
      question_type:
        type: string
      section_id:
        type: string
    required:
    - display_order
    - question_text
    - question_type
    - section_id
    type: object
  questions.UpdateQuestionRequest:
    properties:
      correct_answer:
        type: string
      display_order:
        minimum: 1
        type: integer
      explanation:
        type: string
      is_active:
        type: boolean
      points:
        minimum: 1
        type: integer
      question_data:
        type: object
      question_text:
        type: string
    required:
    - display_order
    - question_text
    type: object
  response.Response:
    properties:
      data: {}
      error: {}
      message:
        type: string
      success:
        type: boolean
    type: object
  sections.CreateSectionRequest:
    properties:
      display_order:
        minimum: 1
        type: integer
      duration_minutes:
        minimum: 1
        type: integer
      section_code:
        maxLength: 50
        minLength: 3
        type: string
      test_id:
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - display_order
    - duration_minutes
    - section_code
    - test_id
    - title
    type: object
  sections.UpdateSectionRequest:
    properties:
      display_order:
        minimum: 1
        type: integer
      duration_minutes:
        minimum: 1
        type: integer
      is_active:
        type: boolean
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - display_order
    - duration_minutes
    - title
    type: object
  tests.CreateTestRequest:
    properties:
      description:
        type: string
      duration_minutes:
        minimum: 1
        type: integer
      passing_score:
        maximum: 100
        minimum: 0
        type: integer
      test_code:
        maxLength: 100
        minLength: 3
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - duration_minutes
    - test_code
    - title
    type: object
  tests.UpdateTestRequest:
    properties:
      description:
        type: string
      duration_minutes:
        minimum: 1
        type: integer
      is_active:
        type: boolean
      passing_score:
        maximum: 100
        minimum: 0
        type: integer
      title:
        maxLength: 255
        minLength: 3
        type: string
    required:
    - duration_minutes
    - title
    type: object
